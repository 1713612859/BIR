<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BIR Discount Calculator</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body { padding: 1.5rem; }
    pre {
      font-family: Menlo, Monaco, Consolas, "Courier New", monospace;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
<div id="app" class="container-fluid py-3">
  <div class="row">
    <!-- 左侧：订单编辑 -->
    <div class="col-md-6">
      <h4 class="mb-3">政府折扣可视化计算器</h4>

      <div class="card mb-3">
        <div class="card-header">基本信息</div>
        <div class="card-body">
          <div class="mb-2">
            <label class="form-label">业务类型</label>
            <select v-model="form.businessType" class="form-select">
              <option value="RETAIL">RETAIL</option>
              <option value="DINING">DINING</option>
              <option value="FAST_FOOD">FAST_FOOD</option>
            </select>
          </div>
          <div class="mb-2">
            <label class="form-label">SI Number</label>
            <input v-model="form.siNumber" class="form-control" />
          </div>
          <div class="mb-2">
            <label class="form-label">Customer Name</label>
            <input v-model="form.customerName" class="form-control" />
          </div>
          <div class="mb-2">
            <label class="form-label">Customer Address</label>
            <input v-model="form.customerAddress" class="form-control" />
          </div>
          <div class="mb-2">
            <label class="form-label">Customer TIN</label>
            <input v-model="form.customerTin" class="form-control" />
          </div>
        </div>
      </div>

      <div class="card mb-3">
        <div class="card-header d-flex justify-content-between align-items-center">
          <span>商品行 (Items)</span>
          <button class="btn btn-sm btn-primary" @click="addItem">+ 添加商品</button>
        </div>
        <div class="card-body">
          <div v-if="!form.items.length" class="text-muted mb-2">当前没有商品，请点击“添加商品”。</div>
          <div v-for="(item, idx) in form.items" :key="idx" class="border rounded p-2 mb-2">
            <div class="d-flex justify-content-between mb-1">
              <strong>行 {{ idx + 1 }}</strong>
              <button class="btn btn-sm btn-outline-danger" @click="removeItem(idx)">删除</button>
            </div>
            <div class="row g-2">
              <div class="col-6">
                <label class="form-label">描述</label>
                <input v-model="item.description" class="form-control" />
              </div>
              <div class="col-3">
                <label class="form-label">数量</label>
                <input type="number" min="1" v-model.number="item.quantity" class="form-control" />
              </div>
              <div class="col-3">
                <label class="form-label">单价(含税)</label>
                <input type="number" step="0.01" v-model.number="item.unitPrice" class="form-control" />
              </div>
              <div class="col-4">
                <label class="form-label">VAT 类型</label>
                <select v-model="item.vatType" class="form-select">
                  <option value="VATABLE">VATABLE</option>
                  <option value="VAT_EXEMPT">VAT_EXEMPT</option>
                  <option value="ZERO_RATED">ZERO_RATED</option>
                </select>
              </div>
              <div class="col-4">
                <label class="form-label">标签 (Discount Tag)</label>
                <select v-model="item.discountTag" class="form-select">
                  <option value="NONE">NONE</option>
                  <option value="MGS">MGS</option>
                  <option value="VBN">VBN</option>
                  <option value="SP">SP</option>
                  <option value="NAAC">NAAC</option>
                  <option value="MOV">MOV</option>
                </select>
              </div>
              <div class="col-4">
                <label class="form-label">常规折扣</label>
                <input type="number" step="0.01" v-model.number="item.regularDiscount" class="form-control" />
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="card mb-3">
        <div class="card-header">政府折扣 (简化：单人)</div>
        <div class="card-body">
          <div class="row g-2">
            <div class="col-6">
              <label class="form-label">折扣类型</label>
              <select v-model="govDiscount.personType" class="form-select">
                <option value="">无</option>
                <option value="SC">SC</option>
                <option value="PWD">PWD</option>
                <option value="NAAC">NAAC</option>
                <option value="SP">SP</option>
                <option value="MOV">MOV</option>
                <option value="DIPLOMATIC">DIPLOMATIC</option>
              </select>
            </div>
            <div class="col-6">
              <label class="form-label">绑定商品(itemId，可选)</label>
              <input type="number" v-model.number="govDiscount.itemId" class="form-control" placeholder="留空=全单" />
            </div>
          </div>
        </div>
      </div>

      <div class="d-flex justify-content-between mb-3">
        <button class="btn btn-primary" @click="preview" :disabled="loading">预览发票</button>
        <span v-if="loading" class="text-muted">计算中...</span>
        <span v-if="error" class="text-danger small">{{ error }}</span>
      </div>
    </div>

    <!-- 右侧：小票预览 + 调试 -->
    <div class="col-md-6">
      <h4 class="mb-3">小票预览</h4>
      <div class="card mb-3">
        <div class="card-body">
          <pre class="bg-dark text-light p-2 mb-0" style="min-height: 400px;">{{ receipt }}</pre>
        </div>
      </div>
      <div class="card">
        <div class="card-header">返回订单(JSON 调试)</div>
        <div class="card-body">
          <pre style="max-height: 220px; overflow:auto; font-size: 12px;">{{ lastOrderJson }}</pre>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<script>
const { createApp, reactive, ref, computed } = Vue

function postJson (url, payload) {
  return fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload)
  }).then(async res => {
    if (!res.ok) throw new Error(await res.text() || ('HTTP ' + res.status))
    return res.json()
  })
}

createApp({
  setup () {
    const form = reactive({
      businessType: 'RETAIL',
      siNumber: '000000001',
      customerName: '',
      customerAddress: '',
      customerTin: '',
      items: []
    })

    const govDiscount = reactive({
      personType: '',
      itemId: null
    })

    const receipt = ref('')
    const lastOrder = ref(null)
    const loading = ref(false)
    const error = ref('')

    const lastOrderJson = computed(() =>
      lastOrder.value ? JSON.stringify(lastOrder.value, null, 2) : ''
    )

    function addItem () {
      const id = form.items.length + 1
      form.items.push({
        itemId: id,
        description: 'Item ' + id,
        quantity: 1,
        unitPrice: 112.0,
        vatType: 'VATABLE',
        discountTag: 'NONE',
        regularDiscount: 0
      })
    }

    function removeItem (idx) {
      form.items.splice(idx, 1)
    }

    async function preview () {
      loading.value = true
      error.value = ''
      try {
        const govList = []
        if (govDiscount.personType) {
          govList.push({
            personType: govDiscount.personType,
            itemId: govDiscount.itemId || null
          })
        }
        const payload = {
          ...form,
          items: form.items,
          govDiscounts: govList
        }
        const resp = await postJson('/api/orders/preview', payload)
        receipt.value = resp.receiptContent || ''
        lastOrder.value = resp.order || null
      } catch (e) {
        error.value = e.message || String(e)
      } finally {
        loading.value = false
      }
    }

    // 默认加一行，方便自测
    addItem()

    return {
      form,
      govDiscount,
      receipt,
      lastOrderJson,
      loading,
      error,
      addItem,
      removeItem,
      preview
    }
  }
}).mount('#app')
</script>
</body>
</html>
